<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Learning Portal</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Navbar -->a
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Smart Learning Portal</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container mt-5">

    <h2>Welcome 👋</h2>
    <p> To Smart Learning Portal </p>
    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f"
     class="img-fluid rounded mt-3"
     alt="Education Image">

    <div class="row mt-4">

      <!-- CARD 1 -->
      <div class="col-md-4">
        <div class="card p-3" onclick="openCourses()">
          
          <h4 class="text-primary">
            <i class="bi bi-book"></i> Courses
          </h4>

          <p>Access your learning materials</p>
        </div>
      </div>

      <!-- CARD 2 -->
      <div class="col-md-4">
        <div class="card p-3" onclick="openQuiz()">

          <h4 class="text-success">
            <i class="bi bi-question-circle"></i> Quiz
          </h4>

          <p>Test your knowledge</p>
        </div>
      </div>

      <!-- CARD 3 -->
      <div class="col-md-4">
        <div class="card p-3" onclick="openProgress()">

          <h4 class="text-danger">
            <i class="bi bi-graph-up"></i> Progress
          </h4>

          <p>Check your performance</p>
        </div>
      </div>
<!-- CARD 4 -->
<div class="col-md-4 mt-3">
  <div class="card p-3" onclick="openContact()">

    <h4 class="text-info">
      <i class="bi bi-envelope"></i> Contact
    </h4>

    <p>Contact and support page</p>

  </div>
</div>
    </div>

  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
